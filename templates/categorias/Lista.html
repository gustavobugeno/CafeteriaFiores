<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Categorías</title>
</head>
<body>

    <h1>Gestión de Categorías</h1>

    <p>
        <a href="{% url 'panel_encargado' %}">
            ← Volver al panel
        </a>
    </p>

    <hr>

    <p>
        <a href="#">
            ➕ Nueva Categoría
        </a>
    </p>
    

    <table border="1" cellpadding="10">

        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Activa</th>
            <th>Acciones</th>
        </tr>

        {% for categoria in categorias %}

        <tr>
            <td>{{ categoria.id }}</td>

            <td>{{ categoria.nombre }}</td>

            <td>
                {% if categoria.activa %}
                    Sí
                {% else %}
                    No
                {% endif %}
            </td>

            <td>
                <a href="#">Ver</a>

                |

                <a href="#">Editar</a>

                |

                <a href="#">Eliminar</a>
            </td>

        </tr>

        {% empty %}

        <tr>
            <td colspan="4">
                No existen categorías
            </td>
        </tr>

        {% endfor %}

    </table>

</body>
</html>
