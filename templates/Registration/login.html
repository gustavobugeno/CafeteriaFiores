{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafetería Fiores - Iniciar Sesión</title>
</head>

<body>

    <div style="
        max-width: 400px;
        margin: 100px auto;
        padding: 30px;
        border: 1px solid #ddd;
        border-radius: 10px;
        text-align: center;
    ">

        <h1>Cafetería Fiores</h1>

        <h3>Iniciar Sesión</h3>

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Ingresar
            </button>
        </form>

        {% if form.errors %}
        <p style="color:red;">
            Usuario o contraseña incorrectos.
        </p>
        {% endif %}

    </div>

</body>
</html>
